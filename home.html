<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/cb/app.webmanifest">
<title>Jugnu</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; background: #f6f1e4; color: #1f2937; display: grid; place-items: center; min-height: 100vh; }
  main { text-align: center; padding: 24px; max-width: 520px; }
  a { display: inline-block; margin-top: 14px; padding: 12px 20px; border-radius: 10px; background: #15803d; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main><p id="say">Opening Jugnu…</p><a id="setup" href="/cb" hidden>Set up this Chromebook</a></main>
<script>
/* /cb/home: the one address that always opens this Chromebook's child home (lane/home).
 * Once the offline worker is in charge it answers this address itself (a redirect to the live home, or to the saved one
 * with no network), so this page is only seen before that: it asks the server for a fresh home with the device key. */
(function () {
  'use strict';
  var get = function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  var key = get('cb-key'), saved = get('cb-hub'), device = get('cb-device');
  var open = function (hub) { location.replace('/h/' + hub + (location.search || '') + location.hash); };
  var stuck = function () {
    if (saved) return open(saved);
    document.getElementById('say').textContent = 'This Chromebook is not set up for Jugnu yet.';
    document.getElementById('setup').hidden = false;
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/__cb/sw.js', { scope: '/' }).catch(function () {});
  if (!key) return stuck();
  var t = setTimeout(stuck, 6000);
  fetch('/__cb/home', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key, device: device }) })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      clearTimeout(t);
      if (!j || !j.hub) return stuck();
      try { localStorage.setItem('cb-hub', j.hub); } catch (e) {}
      open(j.hub);
    }, function () { clearTimeout(t); stuck(); });
}());
</script>
</body>
</html>
